name: Update NSE bond market and 10Y benchmark

on:
  schedule:
    # 5:43 PM East Africa Time, Monday-Friday.
    # Holidays and late/missing PDFs fall back safely.
    - cron: "43 17 * * 1-5"
      timezone: "Africa/Nairobi"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kenya-10y-bond
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text and OCR utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Update NSE bond data
        env:
          TZ: Africa/Nairobi
        run: python scripts/update_kenya_10y_from_nse.py

      - name: Commit updated data
        shell: bash
        run: |
          git add kenya-10y-bond-data.csv kenya-10y-bond-history.csv kenya-bonds-data.csv special-funds-data.csv

          if git diff --cached --quiet; then
            echo "No newer validated NSE bond data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update NSE bond market data"
          git push
