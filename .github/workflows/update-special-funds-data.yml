name: Update special-funds-data.csv from Google Sheets

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-special-funds-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Special Funds CSV from Google Sheets
        shell: bash
        run: |
          set -euo pipefail

          CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTc0EYGi-83FYqWxgR4pJ0j8q6ueQQESUftq_75xyE7la6zW4PCsQMrkxQuR3IXOM4uwRkbS2z0dQKe/pub?gid=78114688&single=true&output=csv"
          OUT_PATH="special-funds-data.csv"
          TEMP_PATH="${OUT_PATH}.new"

          echo "Downloading ${OUT_PATH}..."
          curl --fail --location --silent --show-error "$CSV_URL" -o "$TEMP_PATH"

          if [ ! -s "$TEMP_PATH" ]; then
            echo "ERROR: Downloaded CSV is empty."
            exit 1
          fi

          if ! head -n 1 "$TEMP_PATH" | tr -d '\r' | grep -Fq "Fund ID,Provider,Fund Name,Strategy"; then
            echo "ERROR: The Special Funds CSV has an unexpected header."
            head -n 1 "$TEMP_PATH"
            exit 1
          fi

          ROW_COUNT="$(awk 'END { print NR }' "$TEMP_PATH")"
          if [ "$ROW_COUNT" -lt 43 ]; then
            echo "ERROR: Expected a header and at least 42 fund rows; found ${ROW_COUNT} total rows."
            exit 1
          fi

          mv "$TEMP_PATH" "$OUT_PATH"

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- special-funds-data.csv; then
            echo "No Special Funds data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add special-funds-data.csv
          git commit -m "Auto-update Special Funds data from Google Sheets"
          git push
